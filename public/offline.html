<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F3EE" />
    <meta name="robots" content="noindex" />
    <title>Offline · jambuch</title>
    <!-- Served by the service worker (public/sw.js) when there's no internet
         and the page asked for was never opened on this device. Self-contained:
         no scripts or styles from the site, which may not be stored yet. -->
    <style>
      body {
        margin: 0;
        padding: 40px 16px 56px;
        background: #f5f3ee;
        color: #1b1f1e;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.55;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: Georgia, serif;
        font-size: 28px;
        margin: 0 0 32px;
      }
      .logo span {
        color: #1e5c57;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 30px;
        margin: 0 0 8px;
      }
      p {
        font-size: 18px;
        margin: 0 0 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 20px 0 0;
      }
      li + li {
        margin-top: 12px;
      }
      a.place {
        display: block;
        min-height: 56px;
        padding: 12px 18px;
        border-radius: 12px;
        background: #1e5c57;
        color: #fff;
        text-decoration: none;
        font-size: 20px;
      }
      a.place small {
        display: block;
        font-size: 15px;
        opacity: 0.85;
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 20px;
        border: 1px solid #1e5c57;
        border-radius: 10px;
        background: #fff;
        color: #1e5c57;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#fff" stroke="#0b5a36" stroke-width="3"/><path d="M39.31 35.56Q39.31 38.34 38.06 40.77Q36.8 43.21 34.71 45.06Q32.61 46.91 30.07 47.96Q27.52 49 24.94 49Q23.65 49 22.78 48.62Q21.91 48.250 21.47 47.56Q21.04 46.87 21.04 45.96Q21.04 44.74 21.8 43.94Q22.57 43.15 23.54 43.15Q23.82 43.15 24.27 43.54Q24.72 43.93 25.3 44.44Q25.88 44.95 26.59 45.34Q27.3 45.72 28.08 45.72Q28.97 45.72 29.44 45.24Q29.91 44.75 29.91 43.44V16.87L26.26 15.83V15H42.96V15.83L39.31 16.87Z" transform="translate(-1 0)" fill="#0b5a36"/></svg>jambuch<span>.</span></p>
      <h1>No internet just now</h1>
      <p lang="gu">અત્યારે ઇન્ટરનેટ નથી. પહેલાં વાંચેલાં પ્રકરણો નીચેથી ખોલી શકો છો.</p>
      <p id="lede">Chapters you have already opened on this phone still open:</p>
      <ul id="places"></ul>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Places this device knows (library/bookmarks.ts keys) whose page the
      // service worker has kept.
      (async function () {
        function read(key) {
          try {
            var l = JSON.parse(localStorage.getItem(key) || "[]");
            return Array.isArray(l) ? l : [];
          } catch (e) {
            return [];
          }
        }
        var seen = {};
        var all = read("reader-positions").concat(read("reader-bookmarks")).filter(function (p) {
          if (!p || typeof p.path !== "string" || p.path.indexOf("/library/") !== 0 || seen[p.path]) return false;
          return (seen[p.path] = true);
        });
        var list = document.getElementById("places");
        for (var i = 0; i < all.length; i++) {
          var p = all[i];
          if (window.caches && !(await caches.match(p.path))) continue;
          var a = document.createElement("a");
          a.className = "place";
          a.href = p.para > 0 ? p.path + "#p-" + (p.para + 1) : p.path;
          a.lang = "gu";
          a.textContent = p.title;
          if (p.book) {
            var s = document.createElement("small");
            s.textContent = p.book;
            a.appendChild(s);
          }
          var li = document.createElement("li");
          li.appendChild(a);
          list.appendChild(li);
        }
        if (!list.children.length) {
          document.getElementById("lede").textContent = "None yet: chapters are kept once you have opened them.";
        }
      })();
    </script>
  </body>
</html>
